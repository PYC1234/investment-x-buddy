[build]
  base = "frontend"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

# Frontend is a fully client-side, static Next.js app: build with static export
# (`output: "export"`) and publish the `frontend/out` directory. `.next` is a
# build cache, NOT a publishable directory.
#
# NEXT_PUBLIC_API_BASE_URL stays unset until the Render backend is public.
# Configure it in the Netlify UI (build environment), then trigger a new deploy
# to enable API mode.

# Revalidate the entry document so a refreshed page loads the latest hashed JS.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
