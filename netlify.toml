[build]
  base = "frontend"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  NEXT_PUBLIC_API_BASE_URL = "https://investment-x-buddy.onrender.com"

# Frontend is a fully client-side, static Next.js app: build with static export
# (`output: "export"`) and publish the `frontend/out` directory. `.next` is a
# build cache, NOT a publishable directory.
#
# The public API origin is safe to include here. All provider credentials stay
# on the Render backend and must never be included in the frontend build.

# Revalidate the entry document so a refreshed page loads the latest hashed JS.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
